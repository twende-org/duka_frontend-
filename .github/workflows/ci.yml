name: duka_frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        # The test suite is not part of this repo; pass when nothing matches.
        run: npm test -- --passWithNoTests

      - name: Production build
        run: npm run build

  build-and-push:
    name: Build and push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # VITE_* values are injected at container start via /config.js, so this
      # image is environment-agnostic and needs no build args. The server pulls
      # it; it never builds the app itself.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/duka_frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/duka_frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-production:
    name: Deploy to production
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # Orchestration lives in the infra repo; app source is never cloned here.
            cd ~/twendedigital-infra
            git pull --ff-only
            cd apps/duka_frontend

            docker compose pull web
            docker compose up -d
            docker compose ps

            # nginx and the config.js entrypoint need a moment; probe every replica.
            ok=0
            for attempt in $(seq 1 20); do
              ok=1
              for cid in $(docker compose ps -q web); do
                docker exec "$cid" wget -q -O - http://127.0.0.1/config.js >/dev/null 2>&1 || ok=0
              done
              [ "$ok" = "1" ] && echo "all frontend replicas served config.js" && break
              sleep 3
            done
            [ "$ok" = "1" ]

            docker image prune -f
